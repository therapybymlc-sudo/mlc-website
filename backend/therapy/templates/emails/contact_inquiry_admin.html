<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin: 0; padding: 0; background-color: #F8F9F8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 32px 16px;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #E8ECE8; box-shadow: 0 4px 20px rgba(0,0,0,0.04);">
        <tr>
          <td style="background: #56756D; padding: 28px 32px; text-align: left;">
            <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #C9A960; font-weight: 700;">WEBSITE INQUIRY</span>
            <h1 style="color: #ffffff; font-size: 20px; margin: 6px 0 0; font-weight: 600;">New Contact Form Message</h1>
          </td>
        </tr>
        <tr>
          <td style="padding: 32px;">
            <table width="100%" cellpadding="0" cellspacing="0" style="background: #F8FAF9; border-radius: 12px; padding: 20px; border: 1px solid #E6ECE8; margin-bottom: 20px;">
              <tr><td style="padding: 6px 0; color: #718096; font-size: 13px; width: 120px;">Sender</td><td style="padding: 6px 0; color: #2E2E2E; font-size: 14px; font-weight: 600;">{{ name }}</td></tr>
              <tr><td style="padding: 6px 0; color: #718096; font-size: 13px;">Email</td><td style="padding: 6px 0; color: #56756D; font-size: 14px; font-weight: 600;"><a href="mailto:{{ email }}" style="color: #56756D;">{{ email }}</a></td></tr>
              {% if phone %}
              <tr><td style="padding: 6px 0; color: #718096; font-size: 13px;">Phone</td><td style="padding: 6px 0; color: #2E2E2E; font-size: 14px;">{{ phone }}</td></tr>
              {% endif %}
            </table>

            <div style="background: #FAFAFA; border-left: 4px solid #56756D; padding: 14px 18px; margin-bottom: 24px; border-radius: 4px;">
              <span style="font-size: 11px; text-transform: uppercase; color: #718096; font-weight: bold; letter-spacing: 0.5px;">Message:</span>
              <p style="margin: 6px 0 0; font-size: 14px; color: #2E2E2E; line-height: 1.6; white-space: pre-wrap;">{{ message }}</p>
            </div>

            <table width="100%"><tr><td align="center">
              <a href="{{ admin_messages_url }}" style="display: inline-block; background: #56756D; color: #ffffff; padding: 12px 28px; border-radius: 50px; font-size: 13px; font-weight: 600; text-decoration: none;">
                View in Admin Messages ↗
              </a>
            </td></tr></table>
          </td>
        </tr>
        <tr>
          <td style="background: #F4F6F4; padding: 16px; text-align: center; border-top: 1px solid #E8ECE8;">
            <p style="color: #718096; font-size: 12px; margin: 0;">MLC Health · Contact Form Alert</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
