<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MLC Health — Email Previews Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #EEF2F0; color: #2E2E2E; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #E2E8F0; padding: 24px 16px; overflow-y: auto; flex-shrink: 0; }
    .brand { padding-bottom: 20px; border-bottom: 1px solid #EDF2F7; margin-bottom: 16px; }
    .brand h2 { color: #56756D; font-size: 20px; font-weight: 700; }
    .brand p { font-size: 12px; color: #718096; margin-top: 4px; }
    .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 8px; border-radius: 10px; border: 1px solid transparent; background: transparent; font-size: 14px; font-weight: 500; color: #4A5568; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover { background: #F7FAFC; color: #56756D; }
    .nav-btn.active { background: #56756D; color: #ffffff; font-weight: 600; box-shadow: 0 4px 12px rgba(86,117,109,0.25); }
    .nav-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.2); float: right; }
    .preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { background: #ffffff; padding: 14px 24px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; }
    .toolbar h3 { font-size: 16px; color: #2E2E2E; font-weight: 600; }
    .toolbar span { font-size: 13px; color: #718096; }
    .frame-container { flex: 1; padding: 32px; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; }
    iframe { width: 640px; height: 780px; border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #ffffff; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <h2>MLC Health</h2>
      <p>Transactional Email Design Gallery</p>
    </div>
    <div style="font-size: 11px; font-weight: 700; color: #A0AEC0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-left: 8px;">Transactional Templates</div>
    <button class="nav-btn active" onclick="loadPreview('booking-client.html', this)">
      Session Booking Confirmed
      <span class="nav-tag">Client</span>
    </button>
    <button class="nav-btn" onclick="loadPreview('booking-therapist.html', this)">
      New Booking Alert
      <span class="nav-tag">Therapist</span>
    </button>
    <button class="nav-btn" onclick="loadPreview('intake-admin.html', this)">
      Therapist Matching Alert
      <span class="nav-tag">Admin</span>
    </button>
    <button class="nav-btn" onclick="loadPreview('contract-therapist.html', this)">
      Profile Approved & Contract
      <span class="nav-tag">Therapist</span>
    </button>
    <button class="nav-btn" onclick="loadPreview('published-therapist.html', this)">
      Profile Live on Directory
      <span class="nav-tag">Therapist</span>
    </button>
    <button class="nav-btn" onclick="loadPreview('career-confirm.html', this)">
      Application Received
      <span class="nav-tag">Applicant</span>
    </button>
    <button class="nav-btn" onclick="loadPreview('contact-confirm.html', this)">
      Contact Inquiry Received
      <span class="nav-tag">Visitor</span>
    </button>
  </div>

  <div class="preview-pane">
    <div class="toolbar">
      <h3 id="current-title">Client Session Booking Confirmation</h3>
      <span>Rendered with live inline CSS styling</span>
    </div>
    <div class="frame-container">
      <iframe id="preview-frame" src="booking-client.html"></iframe>
    </div>
  </div>

  <script>
    function loadPreview(file, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('preview-frame').src = file;
      document.getElementById('current-title').innerText = btn.childNodes[0].nodeValue.trim();
    }
  </script>
</body>
</html>
