services:
  - type: web
    name: mlc-backend
    env: docker
    region: singapore
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: https://mlchealth.in,https://www.mlchealth.in
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mlchealth.in,https://www.mlchealth.in
      - key: CLERK_JWKS_URL
        value: https://api.clerk.dev/v1/jwks
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FILE_STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlc-postgres
          property: internalConnectionString
      - key: DB_REGION
        value: singapore
databases:
  - name: mlc-postgres
    plan: basic-256mb
    region: singapore
