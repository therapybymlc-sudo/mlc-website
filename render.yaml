services:
  - type: web
    name: mlc-backend
    env: docker
    region: singapore
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: https://mlchealth.in,https://www.mlchealth.in
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mlchealth.in,https://www.mlchealth.in
      - key: CLERK_JWKS_URL
        value: https://api.clerk.dev/v1/jwks
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FILE_STORAGE_BACKEND
        value: r2
      - key: AWS_STORAGE_BUCKET_NAME
        value: mlc-health-media
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlc-postgres
          property: internalConnectionString
      - key: DB_REGION
        value: singapore
databases:
  - name: mlc-postgres
    plan: basic-256mb
    region: singapore
