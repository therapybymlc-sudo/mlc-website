services:
  - type: web
    name: mlc-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: https://mlchealth.in,https://www.mlchealth.in
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mlchealth.in,https://www.mlchealth.in
      - key: CLERK_JWKS_URL
        value: https://api.clerk.dev/v1/jwks
      - key: CLERK_ISSUER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlc-postgres
          property: connectionString
databases:
  - name: mlc-postgres
    plan: free
    region: singapore
